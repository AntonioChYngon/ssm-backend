# Entorno local con Podman:  podman-compose up -d   (o: podman compose up -d)
services:
  db:
    image: docker.io/library/mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME:-ssm}
      MARIADB_USER: ${DB_USER:-ssm_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
    ports:
      - "3306:3306"
    volumes:
      - ssm-db:/var/lib/mysql
      # Crea el esquema del equipo la primera vez que arranca el volumen vacío.
      - ./db/ssm_mariadb.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 5

  # Buzón falso para desarrollo: recibe todos los correos del backend. Bandeja en http://localhost:8025
  correo:
    image: docker.io/axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: Containerfile
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "3001:3001"
    volumes:
      - ssm-evidencias:/app/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  ssm-db:
  ssm-evidencias:
